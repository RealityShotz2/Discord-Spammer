<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Offertfabriken hjälper svenska företag att svara snabbare på kundförfrågningar, skapa offerter och vinna fler affärer." />
    <meta name="theme-color" content="#0b1020" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Offertfabriken – Fler affärer. Mindre administration.</title>
    <script>
      try {
        var t = localStorage.getItem("op-theme");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
